name: CI

# Lance les tests à chaque push et à chaque pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # Base PostgreSQL jetable pour les tests d'intégration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suivisse
          POSTGRES_PASSWORD: suivisse
          POSTGRES_DB: suivisse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suivisse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgres://suivisse:suivisse@localhost:5432/suivisse_test
      PGPASSWORD: suivisse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Créer les tables
        run: |
          psql -h localhost -U suivisse suivisse_test -v ON_ERROR_STOP=1 -f data/create.sql
          psql -h localhost -U suivisse suivisse_test -v ON_ERROR_STOP=1 -f migrations/add_password_changed.sql

      - name: Lancer les tests
        run: npm test

  docker:
    # On vérifie que l'image de production se construit, seulement si les tests passent
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t suivi-sse-api .
